<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RightSignal</title>
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="/logo.png" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/jpeg" href="/logo.jpeg" media="(prefers-color-scheme: dark)" />
  <link rel="apple-touch-icon" href="/logo.png" />

  <!-- SEO Meta Tags -->
  <meta name="description"
    content="RightSignal is the professional network built for founders, investors, and builders. Share A Global Ecosystem for Growth — connect, collaborate, and grow your ventures." />
  <meta name="keywords"
    content="RightSignal, founders, investors, startups, builders, professional network, A Global Ecosystem for Growth, collaboration, venture capital, entrepreneurs" />
  <meta name="author" content="RightSignal" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://rightsignal.social/" />

  <!-- Theme Color -->
  <meta name="theme-color" content="#0c1929" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

  <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="RightSignal" />
  <meta property="og:title" content="RightSignal — A Global Ecosystem for Growth" />
  <meta property="og:description"
    content="The professional network for founders, investors, and builders. Connect with purpose, collaborate with impact, and grow your ventures." />
  <meta property="og:image" content="https://rightsignal.social/opengraph.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://rightsignal.social/" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="RightSignal — A Global Ecosystem for Growth" />
  <meta name="twitter:description"
    content="The professional network for founders, investors, and builders. Share signal, not noise." />
  <meta name="twitter:image" content="https://rightsignal.social/opengraph.jpg" />

  <!-- Web App Manifest & PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RightSignal" />

  <!-- Google Analytics is initialized dynamically via VITE_GA_MEASUREMENT_ID in src/main.jsx -->
</head>

<body>
  <div id="root"></div>
  <div id="portal-root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('PWA Service Worker registered:', reg.scope))
          .catch(err => console.error('PWA Service Worker registration failed:', err));
      });
    }
  </script>
</body>

</html>
